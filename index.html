<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #000000;
            transition: background-color 0.5s ease;
        }
        h1 {
            font-size: 50pt;
            margin-bottom: 20px;
            font-family: 'Comic Sans MS', cursive;
        }
        button {
            padding: 15px 30px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <button onclick="changeBackgroundColor()">Click Me</button>

    <script>
        function getRandomColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return { r, g, b };
        }

        function getRelativeLuminance({ r, g, b }) {
            const channels = [r, g, b].map((channel) => {
                const value = channel / 255;
                return value <= 0.03928
                    ? value / 12.92
                    : Math.pow((value + 0.055) / 1.055, 2.4);
            });

            return (0.2126 * channels[0]) + (0.7152 * channels[1]) + (0.0722 * channels[2]);
        }

        function getReadableTextColor(backgroundColor) {
            const backgroundLuminance = getRelativeLuminance(backgroundColor);

            for (let attempt = 0; attempt < 100; attempt += 1) {
                const textColor = getRandomColor();
                const textLuminance = getRelativeLuminance(textColor);
                const contrastRatio = (Math.max(backgroundLuminance, textLuminance) + 0.05)
                    / (Math.min(backgroundLuminance, textLuminance) + 0.05);

                if (contrastRatio >= 4.5) {
                    return `rgb(${textColor.r}, ${textColor.g}, ${textColor.b})`;
                }
            }

            return backgroundLuminance > 0.179 ? "#000000" : "#ffffff";
        }

        function changeBackgroundColor() {
            const backgroundColor = getRandomColor();

            document.body.style.backgroundColor = `rgb(${backgroundColor.r}, ${backgroundColor.g}, ${backgroundColor.b})`;
            document.body.style.color = getReadableTextColor(backgroundColor);
        }
    </script>
</body>
</html>
